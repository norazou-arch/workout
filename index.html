<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>Basket Training</title><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><img src="./icon-192.png"><div><b>BASKET TRAINING</b><h1>Ma progression</h1></div></header><section class="rank card"><div class="row"><div><small>Rang actuel</small><h2 id="rank"></h2></div><strong id="pct"></strong></div><div class="bar"><i id="bar"></i></div><div class="row sub"><span id="sessions"></span><span id="toward"></span></div></section><div id="career" class="career"></div><section class="week card"><button id="prev">‹</button><div><strong id="weekTitle"></strong><small id="weekScore"></small></div><button id="next">›</button></section><div class="title"><h2>Entraînements</h2><button id="edit">Modifier</button></div><div id="days"></div><section class="summary card"><div><small>Total validé</small><strong id="total"></strong></div><div><small>Objectif MVP</small><strong><span id="left"></span> restantes</strong></div></section><section class="data-tools card">

    </section>
    </main><dialog id="session"><div class="dhead"><button data-close>‹</button><div><small id="sday"></small><h2 id="sname"></h2></div></div><button id="changeSession" class="outline change-session">↔ Changer cette séance uniquement</button><div id="exercises"></div><button id="add" class="outline">＋ Ajouter un exercice</button><button id="validate" class="primary">Valider la séance</button><p id="hint"></p></dialog><dialog id="planner"><div class="dhead"><button data-pclose>‹</button><h2>Modifier le planning</h2></div><div id="fields"></div><button id="savePlan" class="primary">Enregistrer</button></dialog><dialog id="rankDialog"><div class="dhead"><button data-rclose>‹</button><div><small>DIVISIONS</small><h2 id="rankTitle"></h2></div></div><div id="rankBody"></div></dialog><script src="./app.js"></script></body></html>
