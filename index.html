<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Basket Training</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">BASKET TRAINING</p>
        <h1 id="rankName">Rookie IV</h1>
        <p id="rankProgress">0 / 7 séances</p>
      </div>
      <div class="level-ball">🏀</div>
    </header>

    <section class="card hero">
      <div class="row">
        <div>
          <span class="muted">Cette semaine</span>
          <strong id="weekCount">0/7</strong>
        </div>
        <div class="right">
          <span class="muted">Total</span>
          <strong id="totalCount">0</strong>
        </div>
      </div>
      <div class="progress"><div id="weekBar"></div></div>
      <p id="weekMessage">7 séances pour valider la semaine.</p>
    </section>

    <section>
      <div class="section-title">
        <h2>Planning</h2>
        <button id="editBtn" class="ghost">Modifier</button>
      </div>
      <div id="sessions" class="sessions"></div>
    </section>

    <section class="card">
      <div class="section-title">
        <h2>Prochain palier</h2>
        <span id="nextBadge">Rookie III</span>
      </div>
      <div class="progress"><div id="rankBar"></div></div>
      <p id="nextText"></p>
      <label class="reward-label">Récompense du prochain palier
        <input id="rewardInput" maxlength="80" placeholder="Ex. nouveau ballon, resto, maillot…">
      </label>
      <button id="saveReward">Enregistrer la récompense</button>
      <p id="rewardSaved" class="small"></p>
    </section>

    <section class="stats">
      <div class="card mini"><span>🔥 Semaines 7/7</span><strong id="perfectWeeks">0</strong></div>
      <div class="card mini"><span>🏆 Objectif ultime</span><strong><span id="goalLeft">365</span> restantes</strong></div>
    </section>

    <section class="card">
      <div class="section-title"><h2>Parcours</h2><span>365 séances</span></div>
      <div id="rankList" class="rank-list"></div>
    </section>

    <footer>
      <button id="resetWeek" class="danger ghost">Réinitialiser la semaine</button>
      <p>Données enregistrées sur cet appareil.</p>
    </footer>
  </main>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <h2>Modifier le planning</h2>
      <div id="editFields"></div>
      <div class="dialog-actions">
        <button value="cancel" class="ghost">Annuler</button>
        <button value="save" id="savePlan">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
